name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The full native AirPlay test also runs locally, with Apple's Bonjour
      # service installed. GitHub-hosted Windows runners do not provide it.
      - run: npx vitest run --exclude test/airplay-native.test.ts
      - run: npm run build
      - run: npx playwright test test/e2e/app.spec.ts test/e2e/ios.spec.ts
      - run: npm run package:win
      - name: Create portable download
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path out/Mirrorlab-win32-x64 -DestinationPath release/Mirrorlab-windows-x64.zip
          $hash = (Get-FileHash release/Mirrorlab-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Mirrorlab-windows-x64.zip" | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Mirrorlab-windows-x64
          path: release/*
